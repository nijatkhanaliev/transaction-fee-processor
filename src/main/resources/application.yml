spring:
 application:
  name: transaction-fee-processor

 datasource:
  username: ${DATABASE_USERNAME:admin}
  password: ${DATABASE_PASSWORD:admin}
  url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5438}/${DATABASE_NAME:payment_fees}
  driver-class-name: org.postgresql.Driver
  type: com.zaxxer.hikari.HikariDataSource
  hikari:
   maximum-pool-size: 8
   minimum-idle: 2
   idle-timeout: 600000
   connection-timeout: 30000
   max-lifetime: 1800000

  jpa:
   show-sql: false
   hibernate:
    ddl-auto: validate
   properties:
    hibernate:
     format_sql: false

  rabbitmq:
   listener:
    simple:
     acknowledge-mode: auto
     default-requeue-rejected: false

server:
 port: 8087
 servlet:
  context-path: /api/


